<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Partners | Pravasis IT Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-[#05070a] text-white overflow-x-hidden">

    <div id="header-container"></div>

    <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>

    <main class="relative z-10">

        <section class="pt-48 pb-16 px-6 text-center">
            <div data-aos="fade-up">
                <span class="text-blue-500 font-bold tracking-[0.3em] uppercase text-xs">Our Ecosystem</span>
                <h1 class="text-5xl md:text-7xl font-extrabold text-white mt-6 mb-6">
                    Trusted by <span class="text-gradient">Industry Leaders</span>
                </h1>
                <p class="text-gray-400 text-lg max-w-2xl mx-auto leading-relaxed">
                    We take pride in powering the digital infrastructure for over 500+ cooperative societies,
                    banks, and enterprises across the region.
                </p>
            </div>
        </section>

        <section class="max-w-6xl mx-auto pb-32 px-6">
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-10">

                <div class="glass p-6 rounded-3xl border border-white/10 flex items-center justify-center bg-white/5 hover:bg-white/10 hover:border-blue-500/50 transition-all duration-500 group"
                    data-aos="zoom-in">
                    <div class="bg-white p-4 rounded-2xl w-full h-32 flex items-center justify-center shadow-inner">
                        <img src="assets/Logo/Client1.webp" alt="Client Name"
                            class="max-h-full max-w-full object-contain transition-transform group-hover:scale-110">
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl border border-white/10 flex items-center justify-center bg-white/5 hover:bg-white/10 hover:border-blue-500/50 transition-all duration-500 group"
                    data-aos="zoom-in" data-aos-delay="50">
                    <div class="bg-white p-4 rounded-2xl w-full h-32 flex items-center justify-center shadow-inner">
                        <img src="assets/Logo/Client2.webp" alt="Client Name"
                            class="max-h-full max-w-full object-contain transition-transform group-hover:scale-110">
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl border border-white/10 flex items-center justify-center bg-white/5 hover:bg-white/10 hover:border-blue-500/50 transition-all duration-500 group"
                    data-aos="zoom-in" data-aos-delay="100">
                    <div class="bg-white p-4 rounded-2xl w-full h-32 flex items-center justify-center shadow-inner">
                        <img src="assets/Logo/Client3.webp" alt="Client Name"
                            class="max-h-full max-w-full object-contain transition-transform group-hover:scale-110">
                    </div>
                </div>

                <div class="glass p-6 rounded-3xl border border-white/10 flex items-center justify-center bg-white/5 hover:bg-white/10 hover:border-blue-500/50 transition-all duration-500 group"
                    data-aos="zoom-in" data-aos-delay="100">
                    <div class="bg-white p-4 rounded-2xl w-full h-32 flex items-center justify-center shadow-inner">
                        <img src="assets/Logo/Client4.webp" alt="Client Name"
                            class="max-h-full max-w-full object-contain transition-transform group-hover:scale-110">
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        async function loadComponent(id, file) {
            const res = await fetch(file);
            const html = await res.text();
            document.getElementById(id).innerHTML = html;
        }
        loadComponent('header-container', 'header.html');
        loadComponent('footer-container', 'footer.html');

        particlesJS("particles-js", {
            particles: {
                number: { value: 40, density: { enable: true, value_area: 800 } },
                color: { value: ["#60a5fa", "#ffffff"] },
                shape: { type: "circle" },
                opacity: { value: 0.2, random: true },
                size: { value: 2, random: true },
                line_linked: { enable: true, distance: 150, color: "#60a5fa", opacity: 0.1, width: 1 },
                move: { enable: true, speed: 0.8, direction: "none", out_mode: "out" }
            },
            interactivity: { detect_on: "canvas", events: { onhover: { enable: true, mode: "grab" } } },
            retina_detect: true
        });
    </script>
</body>

</html>
