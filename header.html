<script>
    document.addEventListener("DOMContentLoaded", () => {
        const currentPage = window.location.pathname.split("/").pop() || "index.html";
        const navLinks = document.querySelectorAll(".nav-link");
        const dropdownLinks = document.querySelectorAll(".group\\/item");

        navLinks.forEach(link => {
            const linkPage = link.getAttribute("href");
            if (currentPage === linkPage) {
                link.classList.add("active");
            }
        });

        // Highlight parent "Services" if a sub-page is active
        const servicePages = ["website_dev.html", "sms_services.html", "custom_sw.html", "whatsapp_api.html", "support.html", "digital_marketing.html"];
        const productPages = ["sahakarimis.html", "rioeasy.html", "mulla.html", "vyapari.html", "easylender.html"];

        if (servicePages.includes(currentPage)) {
            const serviceNavLink = document.querySelector('a[href="services.html"]');
            if (serviceNavLink) serviceNavLink.classList.add("active");

            dropdownLinks.forEach(link => {
                if (link.getAttribute("href") === currentPage) {
                    link.classList.add("bg-blue-600/20");
                    link.querySelector("span").classList.replace("text-gray-300", "text-white");
                }
            });
        }

        if (productPages.includes(currentPage)) {
            const productNavLink = document.querySelector('a[href="products.html"]');
            if (productNavLink) productNavLink.classList.add("active");

            dropdownLinks.forEach(link => {
                if (link.getAttribute("href") === currentPage) {
                    link.classList.add("bg-blue-600/20");
                    link.querySelector("span").classList.replace("text-gray-300", "text-white");
                }
            });
        }
    });
</script>
